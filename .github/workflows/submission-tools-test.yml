name: LoomQ tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python3 -m compileall -q competition starter_kit tests

      - name: Run unit and regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify circuit amplitudes and hybrid compilation
        run: |
          python3 starter_kit/selftest.py
          python3 starter_kit/tools/verify_circuits.py
          python3 starter_kit/evaluator.py --level l1 --target spinq,originq,braket
          python3 starter_kit/evaluator.py --level l3

      - name: Verify quantum RISC-V and local model transport
        run: |
          python3 starter_kit/test_quantum_riscv.py
          python3 starter_kit/test_l2_plumbing.py

      - name: Verify web API
        run: python3 starter_kit/test_web_api.py --spawn
